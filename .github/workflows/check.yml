name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - run: uv tool run --from pre-commit pre-commit run --all-files
      - run: uv lock --check
      - run: uv run --no-project --with numpy --with pydantic python -m unittest discover -s tests
      - run: python -m compileall -q main.py so101_sorter scripts tools
